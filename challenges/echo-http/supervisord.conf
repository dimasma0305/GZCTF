# supervisord runs as PID 1 so the container survives the service process dying
# or being restarted: if socat crashes (or is bounced) the container does NOT
# exit — supervisord respawns it in place, so the team's filesystem changes
# (patches) persist. `supervisorctl restart svc` bounces it the same way, which
# is what an in-place "restart (retain data)" would call.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:svc]
command=socat -T 5 TCP-LISTEN:80,reuseaddr,fork SYSTEM:/serve.sh
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
