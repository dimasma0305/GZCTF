name: "testing-gzctf"
services:
  gzctf:
    build:
      context: ./src
      dockerfile: GZCTF/Dockerfile.local
    ports:
      - "8080:8080"
      # - "3306:3306"
      # - "5432:5432"
      # - "6379:6379"
      # - "11211:11211"
      # - "27017:27017"
      # - "9200:9200"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Database=gzctf;Username=gzctf;Password=gzctf
      - ConnectionStrings__Redis=redis:6379,password=gzctf
      - XorKey=gzctf-xor-key
      - ContainerProvider__DockerConfig__ChallengeNetwork=z-test-challenges
      - ContainerProvider__PortMappingType=PlatformProxy
      - ContainerProvider__EnableTrafficCapture=true
      - CheatDetectionConfig__LogContainerAccess=true
      - CheatDetectionConfig__DelayedSubmissionThresholdMinutes=1
      - RequestLogging=true
      - ForwardedOptions__ForwardedHeaders=1
      - ForwardedOptions__ForwardLimit=1
      - ForwardedOptions__TrustedNetworks__0=172.0.4.0/24
      - HoneypotConfig__Enabled=true
      - HoneypotConfig__ListenAddress=0.0.0.0
      - HoneypotConfig__Ports__0__Name=ssh
      - HoneypotConfig__Ports__0__Port=2222
      - HoneypotConfig__Ports__0__Banner=SSH-2.0-OpenSSH_8.4p1 backup-server
      - HoneypotConfig__Ports__0__Enabled=true
      - HoneypotConfig__Ports__1__Name=mysql
      - HoneypotConfig__Ports__1__Port=3306
      - HoneypotConfig__Ports__1__Enabled=true
      - HoneypotConfig__Ports__2__Name=postgres
      - HoneypotConfig__Ports__2__Port=5432
      - HoneypotConfig__Ports__2__Enabled=true
      - HoneypotConfig__Ports__3__Name=redis
      - HoneypotConfig__Ports__3__Port=6379
      - HoneypotConfig__Ports__3__Enabled=true
      - HoneypotConfig__Ports__4__Name=memcached
      - HoneypotConfig__Ports__4__Port=11211
      - HoneypotConfig__Ports__4__Enabled=true
      - HoneypotConfig__Ports__5__Name=mongo
      - HoneypotConfig__Ports__5__Port=27017
      - HoneypotConfig__Ports__5__Enabled=true
      - HoneypotConfig__Ports__6__Name=elastic
      - HoneypotConfig__Ports__6__Port=9200
      - HoneypotConfig__Ports__6__Enabled=true
      - HoneypotConfig__ChainEnabled=true
      - HoneypotConfig__ChainThreshold=3
      - HoneypotConfig__ChainWindowMinutes=30
      - HoneypotConfig__ChainSweepIntervalSeconds=60
      # Where AdWireGuardSyncService reads server.pub/server.key and writes
      # wg0.conf. Mount-point must match the wireguard sidecar's /config.
      - Ad__Vpn__ConfigDir=/wg-config
      - Ad__Vpn__ClientCidr=10.13.37.0/24
      # Operator should set this to a host-reachable UDP endpoint (public IP +
      # port if WG clients connect from outside the host). The default points
      # at the same hostname players use to reach the web UI; override via
      # AD_VPN_SERVER_ENDPOINT env when deploying to a different host.
      - Ad__Vpn__ServerEndpoint=${AD_VPN_SERVER_ENDPOINT:-1pc.tf:51820}
      # Shared secret authenticating the ssh-jump sidecar to gzctf's
      # internal lookup/exec endpoints. ssh-jump uses the same value.
      # Generate with `openssl rand -hex 32` for production deploys.
      - Ad__Ssh__InternalSecret=${AD_SSH_INTERNAL_SECRET:-dev-only-rotate-me-before-prod}
      - Ad__Ssh__PublicHost=${AD_SSH_PUBLIC_HOST:-1pc.tf}
      - Ad__Ssh__PublicPort=${AD_SSH_PUBLIC_PORT:-22022}
      # A&D checker: how many checker container runs in flight at once,
      # and the hard timeout per run. Defaults are sized for ~50 teams ×
      # ~5 challenges; raise MaxParallel if SLA badges lag the round.
      - Ad__Checker__MaxParallel=${AD_CHECKER_MAX_PARALLEL:-10}
      - Ad__Checker__TimeoutSeconds=${AD_CHECKER_TIMEOUT_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "gzctf-files:/app/files"
      - "gzctf-repos:/app/repos"
      - "wg-config:/wg-config"
    depends_on:
      - postgres
      - redis
    # No explicit challenge networks here either — DockerProvider's
    # EnsureNetworkCreated calls AttachSelfToNetwork on startup, so gzctf
    # auto-joins the platform-managed z-test-challenges-{open,isolated} bridges
    # right after the Docker provider initializes. Compose only needs to give
    # it the default network for control-plane connectivity (postgres + redis).
    networks:
      - default

  ssh-jump:
    build:
      context: ./ssh-jump
    environment:
      # gzctf control-plane URL the AuthorizedKeysCommand + WS relay
      # talk to. Uses the docker DNS name so traffic stays on the
      # internal compose network (postgres/redis live here too — the
      # shared secret is the only thing standing between this box and
      # the lookup endpoints, so keep the secret strong).
      - GZCTF_URL=http://gzctf:8080
      - INTERNAL_SECRET=${AD_SSH_INTERNAL_SECRET:-dev-only-rotate-me-before-prod}
    ports:
      # AD_SSH_PUBLIC_PORT (default 22022) on the host → 22 inside;
      # players ssh <challenge-id>@host -p ${AD_SSH_PUBLIC_PORT:-22022}
      - "${AD_SSH_PUBLIC_PORT:-22022}:22"
    depends_on:
      - gzctf
    networks:
      - default
    restart: unless-stopped

  wireguard:
    build:
      context: ./wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
    volumes:
      - "wg-config:/config"
    networks:
      # Dedicated bootstrap network — nothing else is on it. Just gives the
      # sidecar an eth + lets docker NAT UDP 51820 from the host into it.
      # AdVpnTopology (in gzctf) inspects + attaches the sidecar to the
      # platform's challenge networks at runtime; adding / renaming a
      # challenge network needs no compose change. The sidecar deliberately
      # has no eth on the gzctf default network (postgres + redis live
      # there), so even if iptables FORWARD is wide open there's no route
      # from a VPN client into the control plane.
      - wg-bootstrap
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=gzctf
      - POSTGRES_USER=gzctf
      - POSTGRES_PASSWORD=gzctf
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    command: redis-server --requirepass gzctf
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  gzctf-files:
  gzctf-repos:
  wg-config:

networks:
  # Sidecar's bootstrap network — intentionally lonely so VPN clients can't
  # bridge through it to anything. AdVpnTopology attaches the sidecar to
  # the challenge networks at runtime.
  wg-bootstrap:
    driver: bridge
