name: "testing-gzctf"
services:
  gzctf:
    build:
      context: ./src
      dockerfile: GZCTF/Dockerfile.local
    # Self-heal: the .NET process can take a rare native SIGSEGV in musl libc
    # (Alpine base) on a thread-pool worker; without a restart policy a single
    # crash takes the whole platform down until someone notices (it sat down ~55m).
    restart: unless-stopped
    # Covers the OTHER failure mode restart:unless-stopped doesn't: hung-but-alive
    # (deadlock, thread-pool exhaustion) rather than a hard process exit. Compose
    # picks this up from the image's own HEALTHCHECK too, but it's declared here
    # explicitly so `docker compose ps`/`docker inspect` surface health without
    # relying on that being unchanged, and so a future `depends_on: condition:
    # service_healthy` on this service is possible without edits elsewhere.
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz" ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    ports:
      - "8080:8080"
      # - "3306:3306"
      # - "5432:5432"
      # - "6379:6379"
      # - "11211:11211"
      # - "27017:27017"
      # - "9200:9200"
    environment:
      # Production so the DevDataSeeder no longer re-creates "Dev Test Game" +
      # User1-4 on every restart, and self-registered users are NOT auto-promoted
      # to admin (important now that the UI is public at tcp.1pc.tf). ADMIN_PASSWORD
      # only seeds an Admin if one doesn't already exist — the current Admin account
      # is preserved. NOTE: in Production, confirmation/reset emails are actually
      # sent via SMTP; with no mailer configured here, self-registration (which
      # requires email confirmation) is effectively closed — acceptable for this host.
      - ASPNETCORE_ENVIRONMENT=Production
      # Capture a crash dump + report on the next native SIGSEGV (musl/vfscanf) so
      # we get a real native+managed stack. Heap dump → /dumps (host-mounted).
      - DOTNET_DbgEnableMiniDump=1
      - DOTNET_DbgMiniDumpType=2
      - DOTNET_DbgMiniDumpName=/dumps/gzctf.%p.%t.dmp
      - DOTNET_EnableCrashReport=1
      - DOTNET_CreateDumpVerboseDiagnostics=1
      - ADMIN_PASSWORD=${GZCTF_ADMIN_PASSWORD:-Admin@2022}
      - ConnectionStrings__Database=Host=postgres;Database=gzctf;Username=gzctf;Password=gzctf
      # abortConnect=false: don't hard-throw at connect time if redis is momentarily
      # unreachable (startup race / brief blip) — let the multiplexer retry in the background.
      - ConnectionStrings__Redis=redis:6379,password=gzctf,abortConnect=false
      - XorKey=gzctf-xor-key
      # Public scheme for absolute-URL generation (OAuth redirect_uri, email links) when
      # behind a TLS-terminating proxy. X-Forwarded-Proto is honoured if the proxy sends
      # it; this is the fallback when it doesn't. Set to http only for a plain-HTTP host.
      - PublicScheme=https
      # Host-header allowlist (ASP.NET Core host filtering). Email links + the BYOC
      # setup script trust the request Host, so a direct-facing server should pin
      # this to its public host(s) to block Host-header injection / phishing, e.g.
      # ALLOWED_HOSTS=ctf.example.com. Default "*" is safe ONLY behind a reverse
      # proxy that routes by Host (it already drops spoofed Hosts). Semicolon list;
      # include the internal name (e.g. gzctf) if other containers call this over HTTP.
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      # --- External OAuth login (Google / Discord) ---
      # Primary path: configure these in the admin UI at /admin/settings -> OAuth
      # (DB-backed, secrets obfuscated, applies live without a restart). A provider's
      # sign-in button appears only when BOTH its client id and secret are set.
      # Register ONE shared redirect URI with BOTH providers (the provider is recovered from
      # the OAuth state, so a single callback URL serves all):
      #   https://<your-host>/api/oauth/callback
      #   (Google Cloud Console + Discord Developer Portal; Discord scopes: identify, email)
      # The platform must see the public https scheme (configure ProxyTrust/forwarded
      # headers) so the redirect_uri sent to the provider matches what you registered.
      # These env vars are an optional bootstrap alternative to the admin UI:
      # - OAuthConfig__GoogleClientId=${GZCTF_GOOGLE_CLIENT_ID:-}
      # - OAuthConfig__GoogleClientSecret=${GZCTF_GOOGLE_CLIENT_SECRET:-}
      # - OAuthConfig__DiscordClientId=${GZCTF_DISCORD_CLIENT_ID:-}
      # - OAuthConfig__DiscordClientSecret=${GZCTF_DISCORD_CLIENT_SECRET:-}
      - ContainerProvider__DockerConfig__ChallengeNetwork=challenges
      - ContainerProvider__PortMappingType=PlatformProxy
      - ContainerProvider__EnableTrafficCapture=true
      # --- Container backend ---
      # Docker provider: challenges spawn as host docker containers on the
      # challenges-{open,isolated} networks; /flag is the read-only
      # ad-flags bind-mount (no pull sidecar); precise `docker diff` + post-game
      # snapshot tarballs are available. Set Type=Kubernetes to use the k3d
      # backend instead (KubernetesConfig + Ad__FlagPullBaseUrl below apply then).
      - ContainerProvider__Type=Docker
      - ContainerProvider__KubernetesConfig__KubeConfig=/app/kube-config.yaml
      - ContainerProvider__KubernetesConfig__Namespace=gzctf-challenges
      # k3d side-loads images (`k3d image import`); don't force a registry pull.
      - ContainerProvider__KubernetesConfig__ImagePullPolicy=IfNotPresent
      # Deny challenge egress to the k3d node/control-plane network (kube-api,
      # kubelet, SSH, control-plane non-flag ports). Augments the built-in
      # private+link-local baseline; the flag-pull endpoint (172.0.12.1:8080) is
      # still reachable via the dedicated allow-rule the provider adds.
      - ContainerProvider__KubernetesConfig__AllowCidr__0=172.0.12.0/24
      # A&D flag pull: team pods fetch the planted flag from gzctf. Must be an
      # IP (pods run external DNS, can't resolve cluster/host names). 172.0.12.1
      # is the k3d-gzctf network gateway (= host) → published port 8080.
      - Ad__FlagPullBaseUrl=http://172.0.12.1:8080
      - CheatDetectionConfig__LogContainerAccess=true
      - CheatDetectionConfig__DelayedSubmissionThresholdMinutes=1
      - RequestLogging=true
      # --- Observability (TEMP: bottleneck investigation) ---
      # GZCTF ships full OpenTelemetry (ASP.NET/EF/Npgsql/Redis spans + runtime
      # metrics) + a Prometheus exporter on :3000, gated by this Telemetry section.
      # Push traces+metrics+logs to the all-in-one otel-lgtm (Grafana/Tempo/Loki/Prom).
      - Telemetry__Enable=true
      - Telemetry__Prometheus__Enable=true
      - Telemetry__OpenTelemetry__Enable=true
      - Telemetry__OpenTelemetry__Protocol=Grpc
      - Telemetry__OpenTelemetry__EndpointUri=http://otel-lgtm:4317
      - ForwardedOptions__ForwardedHeaders=1
      - ForwardedOptions__ForwardLimit=1
      - ForwardedOptions__TrustedNetworks__0=172.0.4.0/24
      # Trust the traefik reverse-proxy network so the real client IP from
      # X-Forwarded-For is honoured when reached via tcp.1pc.tf (otherwise
      # honeypot / cheat-detection would log traefik's address, not the player's).
      - ForwardedOptions__TrustedNetworks__1=172.1.0.0/16
      - HoneypotConfig__Enabled=true
      - HoneypotConfig__ListenAddress=0.0.0.0
      - HoneypotConfig__Ports__0__Name=ssh
      - HoneypotConfig__Ports__0__Port=2222
      - HoneypotConfig__Ports__0__Banner=SSH-2.0-OpenSSH_8.4p1 backup-server
      - HoneypotConfig__Ports__0__Enabled=true
      - HoneypotConfig__Ports__1__Name=mysql
      - HoneypotConfig__Ports__1__Port=3306
      - HoneypotConfig__Ports__1__Enabled=true
      - HoneypotConfig__Ports__2__Name=postgres
      - HoneypotConfig__Ports__2__Port=5432
      - HoneypotConfig__Ports__2__Enabled=true
      - HoneypotConfig__Ports__3__Name=redis
      - HoneypotConfig__Ports__3__Port=6379
      - HoneypotConfig__Ports__3__Enabled=true
      - HoneypotConfig__Ports__4__Name=memcached
      - HoneypotConfig__Ports__4__Port=11211
      - HoneypotConfig__Ports__4__Enabled=true
      - HoneypotConfig__Ports__5__Name=mongo
      - HoneypotConfig__Ports__5__Port=27017
      - HoneypotConfig__Ports__5__Enabled=true
      - HoneypotConfig__Ports__6__Name=elastic
      - HoneypotConfig__Ports__6__Port=9200
      - HoneypotConfig__Ports__6__Enabled=true
      - HoneypotConfig__ChainEnabled=true
      - HoneypotConfig__ChainThreshold=3
      - HoneypotConfig__ChainWindowMinutes=30
      - HoneypotConfig__ChainSweepIntervalSeconds=60
      # Where AdWireGuardSyncService reads server.pub/server.key and writes
      # wg0.conf. Mount-point must match the wireguard sidecar's /config.
      - Ad__Vpn__ConfigDir=/wg-config
      - Ad__Vpn__ClientCidr=10.13.37.0/24
      # Operator should set this to a host-reachable UDP endpoint (public IP +
      # port if WG clients connect from outside the host). The default points
      # at the same hostname players use to reach the web UI; override via
      # AD_VPN_SERVER_ENDPOINT env when deploying to a different host.
      - Ad__Vpn__ServerEndpoint=${AD_VPN_SERVER_ENDPOINT:-1pc.tf:51820}
      # Shared secret authenticating the ssh-jump sidecar to gzctf's
      # internal lookup/exec endpoints. ssh-jump uses the same value.
      # Generate with `openssl rand -hex 32` for production deploys.
      - Ad__Ssh__InternalSecret=${AD_SSH_INTERNAL_SECRET:-dev-only-rotate-me-before-prod}
      - Ad__Ssh__PublicHost=${AD_SSH_PUBLIC_HOST:-1pc.tf}
      - Ad__Ssh__PublicPort=${AD_SSH_PUBLIC_PORT:-22022}
      # A&D checker: how many checker container runs in flight at once,
      # and the hard timeout per run. Defaults are sized for ~50 teams ×
      # ~5 challenges; raise MaxParallel if SLA badges lag the round.
      - Ad__Checker__MaxParallel=${AD_CHECKER_MAX_PARALLEL:-10}
      - Ad__Checker__TimeoutSeconds=${AD_CHECKER_TIMEOUT_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "gzctf-files:/app/files"
      - "gzctf-repos:/app/repos"
      - "wg-config:/wg-config"
      # Host-backed A&D flag files, bind-mounted read-only into each team's
      # container so /flag can't be deleted/tampered by container-root. gzctf
      # auto-derives this volume's host path to use as the bind source.
      # (Docker-provider only; on K8s the pull-sidecar delivers the flag.)
      - "ad-flags:/app/ad-flags"
      # Kubeconfig for the Kubernetes container backend (read-only).
      - "./kube-config.k3d.yaml:/app/kube-config.yaml:ro"
      # Crash dumps: on a native SIGSEGV the runtime writes a minidump +
      # .crashreport.json here so the next musl/vfscanf crash gives a real stack.
      - "./dumps:/dumps"
    # Wait for the data services to be HEALTHY (not just started) so a fresh `up` / host
    # reboot can't race gzctf ahead of redis/postgres and throw during DI activation.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No explicit challenge networks here either — DockerProvider's
    # EnsureNetworkCreated calls AttachSelfToNetwork on startup, so gzctf
    # auto-joins the platform-managed challenges-{open,isolated} bridges
    # right after the Docker provider initializes. Compose only needs to give
    # it the default network for control-plane connectivity (postgres + redis).
    networks:
      - default
      # Reach the k3d Kubernetes API (k3d-gzctf-serverlb:6443) in-network.
      - k3d
      # Reverse-proxy network so traefik can route tcp.1pc.tf → :8080.
      - traefik
    labels:
      # Publish the web UI at https://tcp.1pc.tf via the shared traefik proxy
      # (LetsEncrypt over Cloudflare DNS, websecure entrypoint). The direct
      # 8080:8080 host port above stays for local/IP access.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.gzctf.rule=Host(`tcp.1pc.tf`)"
      - "traefik.http.routers.gzctf.entrypoints=websecure"
      - "traefik.http.routers.gzctf.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gzctf.service=gzctf"
      - "traefik.http.services.gzctf.loadbalancer.server.port=8080"

  ssh-jump:
    build:
      context: ./ssh-jump
    environment:
      # gzctf control-plane URL the AuthorizedKeysCommand + WS relay
      # talk to. Uses the docker DNS name so traffic stays on the
      # internal compose network (postgres/redis live here too — the
      # shared secret is the only thing standing between this box and
      # the lookup endpoints, so keep the secret strong).
      - GZCTF_URL=http://gzctf:8080
      - INTERNAL_SECRET=${AD_SSH_INTERNAL_SECRET:-dev-only-rotate-me-before-prod}
    ports:
      # AD_SSH_PUBLIC_PORT (default 22022) on the host → 22 inside;
      # players ssh <challenge-id>@host -p ${AD_SSH_PUBLIC_PORT:-22022}
      - "${AD_SSH_PUBLIC_PORT:-22022}:22"
    depends_on:
      - gzctf
    networks:
      - default
    restart: unless-stopped

  wireguard:
    build:
      context: ./wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
    volumes:
      - "wg-config:/config"
    networks:
      # Dedicated bootstrap network — nothing else is on it. Just gives the
      # sidecar an eth + lets docker NAT UDP 51820 from the host into it.
      # AdVpnTopology (in gzctf) inspects + attaches the sidecar to the
      # platform's challenge networks at runtime; adding / renaming a
      # challenge network needs no compose change. The sidecar deliberately
      # has no eth on the gzctf default network (postgres + redis live
      # there), so even if iptables FORWARD is wide open there's no route
      # from a VPN client into the control plane.
      - wg-bootstrap
    restart: unless-stopped

  # Builds the A&D "bring your own container" relay/agent image locally under the
  # same tag GZCTF launches per-team relays from, so relay starts hit a local copy
  # (no registry pull). Not a long-running service — /bin/true builds and exits;
  # `docker compose up` leaves an exited container behind, which is expected.
  # The SAME image is published multi-arch on Docker Hub as the team agent, so a
  # team's `docker compose up` just pulls it (one click, no registry setup).
  # Override both with Ad__Byoc__RelayImage / Ad__Byoc__AgentImage.
  byoc-relay:
    build:
      context: ./byoc-relay
    image: dimasmaualana/gzctf-byoc-relay:latest
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    # TEMP (bottleneck investigation): load pg_stat_statements so we can rank the
    # slowest queries by total exec time. Requires a postgres restart + CREATE EXTENSION.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    environment:
      - POSTGRES_DB=gzctf
      - POSTGRES_USER=gzctf
      - POSTGRES_PASSWORD=gzctf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The data services carried no restart policy while gzctf/ssh-jump/wireguard all use
    # unless-stopped — so a postgres/redis crash or a host reboot left them down indefinitely
    # (gzctf auto-restarts but then can't reach its DB/cache). Match the app's policy.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gzctf -d gzctf"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:alpine
    command: redis-server --requirepass gzctf
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "gzctf", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # TEMP (bottleneck investigation): Grafana's all-in-one OTLP backend — receives
  # OTLP push from gzctf and stores traces (Tempo) / metrics (Prometheus) / logs
  # (Loki), all explorable in Grafana. Remove this + the Telemetry__* env after.
  # otel-lgtm:
  #   image: grafana/otel-lgtm
  #   ports:
  #     - "127.0.0.1:3001:3000"   # Grafana UI → http://127.0.0.1:3001 (explore traces/metrics/logs)
  #   networks:
  #     - default

volumes:
  postgres_data:
  redis_data:
  gzctf-files:
  gzctf-repos:
  wg-config:
  ad-flags:

networks:
  # Sidecar's bootstrap network — intentionally lonely so VPN clients can't
  # bridge through it to anything. AdVpnTopology attaches the sidecar to
  # the challenge networks at runtime.
  wg-bootstrap:
    driver: bridge
  # The local k3d cluster's docker network — joined so gzctf can reach the
  # Kubernetes API server. Created by `k3d cluster create`, external here.
  k3d:
    external: true
    name: k3d-gzctf
  # Shared reverse-proxy network (created by the top-level /homelab/compose.yml
  # traefik stack). External so this compose project doesn't try to own it.
  traefik:
    external: true
