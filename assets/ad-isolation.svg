<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style>
      .h{font-size:12px;font-weight:700;letter-spacing:1px}
      .ct{text-anchor:middle;font-size:12px;font-weight:700}
      .bt{text-anchor:middle;font-size:13px;font-weight:700}
      .bs{text-anchor:middle;font-size:11px;fill:#64748b;font-weight:400}
      .rl{font-size:12.5px;fill:#334155}
      .hd{text-anchor:middle;font-size:12.5px;font-weight:700;fill:#0f172a}
    </style>
  </defs>
  <rect width="1280" height="1000" fill="#f8fafc"/>
  <text x="640" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">A&amp;D / KotH — network isolation &amp; containment</text>
  <text x="640" y="64" text-anchor="middle" font-size="13" fill="#64748b">policies are EGRESS-only — legit ingress (player attacks, the checker) always reaches the target</text>

  <!-- ATTACK PATH -->
  <rect x="30" y="84" width="1220" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="50" y="108" class="h" fill="#1d4ed8">INTENDED ATTACK PATH — ingress</text>
  <rect x="60" y="122" width="170" height="58" rx="9" fill="#fff" stroke="#93c5fd"/><text x="145" y="146" class="bt" fill="#1e3a8a">player / bot</text><text x="145" y="166" class="bs">VPN client /32</text>
  <rect x="320" y="122" width="240" height="58" rx="9" fill="#fff" stroke="#93c5fd"/><text x="440" y="146" class="bt" fill="#1e3a8a">WireGuard sidecar</text><text x="440" y="166" class="bs">AllowedIPs → challenge subnets only</text>
  <rect x="650" y="122" width="240" height="58" rx="9" fill="#fff" stroke="#93c5fd"/><text x="770" y="146" class="bt" fill="#1e3a8a">target service :port</text><text x="770" y="166" class="bs">team's own container · /flag (RO)</text>
  <rect x="980" y="122" width="220" height="58" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="1090" y="146" class="bt" fill="#5b21b6">gzctf checker</text><text x="1090" y="166" class="bs">getflag + probe</text>
  <line x1="232" y1="151" x2="318" y2="151" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="562" y1="151" x2="648" y2="151" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="978" y1="151" x2="892" y2="151" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <text x="640" y="202" text-anchor="middle" font-size="11.5" fill="#475569">the WG sidecar has NO interface on the control-plane network → a VPN client can never bridge through to postgres / redis</text>

  <!-- CONTAINMENT MATRIX -->
  <text x="50" y="252" class="h" fill="#b91c1c">CONTAINMENT — egress from a fully-popped (root) challenge container</text>
  <text x="48" y="284" font-size="12.5" font-weight="700" fill="#334155">reachable target ↓  /  mode →</text>
  <text x="453" y="284" class="hd">Docker · isolated</text>
  <text x="651" y="284" class="hd">Docker · open</text>
  <text x="849" y="284" class="hd">K8s · isolated</text>
  <text x="1047" y="284" class="hd">K8s · open</text>
  <line x1="40" y1="294" x2="1142" y2="294" stroke="#e2e8f0"/>

  <!-- rows: cell rect w190 h42 at x 358/556/754/952 ; pitch 50 from y302 -->
  <!-- R1 internet -->
  <text x="48" y="329" class="rl">Public internet</text>
  <rect x="358" y="302" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="453" y="328" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="556" y="302" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="651" y="328" class="ct" fill="#15803d">allowed</text>
  <rect x="754" y="302" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="849" y="328" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="952" y="302" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="1047" y="328" class="ct" fill="#15803d">allowed</text>
  <!-- R2 metadata -->
  <text x="48" y="379" class="rl">Cloud metadata 169.254.169.254</text>
  <rect x="358" y="352" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="453" y="378" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="556" y="352" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="651" y="378" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="754" y="352" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="849" y="378" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="952" y="352" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="1047" y="378" class="ct" fill="#b91c1c">BLOCKED</text>
  <!-- R3 pivot -->
  <text x="48" y="429" class="rl">Other teams' containers (pivot)</text>
  <rect x="358" y="402" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="453" y="428" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="556" y="402" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="651" y="428" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="754" y="402" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="849" y="428" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="952" y="402" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="1047" y="428" class="ct" fill="#b91c1c">BLOCKED</text>
  <!-- R4 control plane -->
  <text x="48" y="479" class="rl">Control plane (postgres / redis)</text>
  <rect x="358" y="452" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="453" y="478" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="556" y="452" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="651" y="478" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="754" y="452" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="849" y="478" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="952" y="452" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="1047" y="478" class="ct" fill="#b91c1c">BLOCKED</text>
  <!-- R5 kube -->
  <text x="48" y="529" class="rl">kube-api / kubelet / node CIDR</text>
  <rect x="358" y="502" width="190" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="453" y="528" class="ct" fill="#64748b">n/a</text>
  <rect x="556" y="502" width="190" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="651" y="528" class="ct" fill="#64748b">n/a</text>
  <rect x="754" y="502" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="849" y="528" class="ct" fill="#b91c1c">BLOCKED</text>
  <rect x="952" y="502" width="190" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="1047" y="528" class="ct" fill="#b91c1c">BLOCKED</text>
  <!-- R6 flag -->
  <text x="48" y="577" class="rl">Flag delivery to /flag</text>
  <rect x="358" y="550" width="190" height="42" rx="6" fill="#fef9c3" stroke="#fde047"/><text x="453" y="576" class="ct" fill="#854d0e">RO bind-mount</text>
  <rect x="556" y="550" width="190" height="42" rx="6" fill="#fef9c3" stroke="#fde047"/><text x="651" y="576" class="ct" fill="#854d0e">RO bind-mount</text>
  <rect x="754" y="550" width="190" height="42" rx="6" fill="#fef9c3" stroke="#fde047"/><text x="849" y="576" class="ct" fill="#854d0e">pull /32 (RO)</text>
  <rect x="952" y="550" width="190" height="42" rx="6" fill="#fef9c3" stroke="#fde047"/><text x="1047" y="576" class="ct" fill="#854d0e">pull /32 (RO)</text>
  <!-- R7 dns -->
  <text x="48" y="625" class="rl">DNS</text>
  <rect x="358" y="598" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="453" y="624" class="ct" fill="#15803d">allowed</text>
  <rect x="556" y="598" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="651" y="624" class="ct" fill="#15803d">allowed</text>
  <rect x="754" y="598" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="849" y="624" class="ct" fill="#15803d">allowed</text>
  <rect x="952" y="598" width="190" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="1047" y="624" class="ct" fill="#15803d">allowed</text>

  <text x="48" y="664" font-size="11.5" fill="#475569">Both providers now enforce the same containment: Kubernetes via per-pod egress NetworkPolicy; Docker via DOCKER-USER iptables on the challenge</text>
  <text x="48" y="682" font-size="11.5" fill="#475569">bridges (AdEgressIsolationService) — established replies + the gzctf checker + the WG sidecar are exempted so legit ingress + internet on "open" still work.</text>

  <!-- DEFENSE IN DEPTH -->
  <rect x="30" y="706" width="1220" height="218" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="50" y="730" class="h" fill="#6d28d9">DEFENSE-IN-DEPTH LAYERS</text>
  <rect x="48" y="744" width="290" height="70" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="64" y="766" font-size="12.5" font-weight="700" fill="#5b21b6">Undeletable flag</text><text x="64" y="784" font-size="11" fill="#475569">/flag is root-owned, read-only mount</text><text x="64" y="800" font-size="11" fill="#475569">— popped root reads it, can't tamper</text>
  <rect x="352" y="744" width="290" height="70" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="368" y="766" font-size="12.5" font-weight="700" fill="#5b21b6">WireGuard boundary</text><text x="368" y="784" font-size="11" fill="#475569">peer /32 scoped to challenge subnets;</text><text x="368" y="800" font-size="11" fill="#475569">sidecar off the control-plane net</text>
  <rect x="656" y="744" width="290" height="70" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="672" y="766" font-size="12.5" font-weight="700" fill="#5b21b6">Honeypot decoys</text><text x="672" y="784" font-size="11" fill="#475569">ssh/mysql/pg/redis/memcached/mongo/es</text><text x="672" y="800" font-size="11" fill="#475569">— touching a decoy port flags the team</text>
  <rect x="960" y="744" width="290" height="70" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="976" y="766" font-size="12.5" font-weight="700" fill="#5b21b6">K8s hardening</text><text x="976" y="784" font-size="11" fill="#475569">no SA token (automount off); egress</text><text x="976" y="800" font-size="11" fill="#475569">netpol CNI-enforced — startup audit probes</text>
  <rect x="48" y="824" width="594" height="84" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="64" y="848" font-size="12.5" font-weight="700" fill="#5b21b6">Egress hardening — "open" mode</text><text x="64" y="868" font-size="11" fill="#475569">K8s: allow 0.0.0.0/0 EXCEPT 10/8 · 172.16/12 · 192.168/16 · 169.254/16 (metadata)</text><text x="64" y="886" font-size="11" fill="#475569">+ operator node/control-plane AllowCidr → hits the internet but can't pivot inward</text>
  <rect x="656" y="824" width="594" height="84" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="672" y="848" font-size="12.5" font-weight="700" fill="#5b21b6">Isolated mode — deny-all</text><text x="672" y="868" font-size="11" fill="#475569">K8s: block all egress except the flag-pull /32 + DNS · Docker: no-masquerade (no internet)</text><text x="672" y="886" font-size="11" fill="#475569">per-challenge toggle GameChallenge.AdAllowEgress — open ⇄ isolated, moved live without recreate</text>

  <text x="640" y="952" text-anchor="middle" font-size="12" fill="#64748b">Threat model: a full RCE on a challenge container is assumed — these layers bound the blast radius (no lateral pivot, no metadata/SSRF creds, no control plane, flag intact).</text>
  <text x="640" y="974" text-anchor="middle" font-size="11.5" fill="#94a3b8">Cross-team correlation on flag egress is impossible — the proxy requires team-session auth (covered by the CrossTeamIP / StolenFlag detectors).</text>
</svg>
